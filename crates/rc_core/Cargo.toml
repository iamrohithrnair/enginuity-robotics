[package]
name = "rc_core"
version = "0.1.0"
edition = "2021"
description = "Enginuity core: robot kinematics, inverse kinematics, collision checks and robot-file parsing (native + wasm32)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }

serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
